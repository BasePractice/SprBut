spring:
  application:
    name: sprbut-cloud
  cloud:
    discovery:
      client:
        simple:
          instances:
            warehouse:
              - uri: http://localhost:8091
              - uri: http://localhost:8092
resilience4j:
  circuitbreaker:
    configs:
      default:
        sliding-window-size: 4
        minimum-number-of-calls: 4
        failure-rate-threshold: 50
        wait-duration-in-open-state: 10s
    instances:
      warehouse:
        base-config: default
