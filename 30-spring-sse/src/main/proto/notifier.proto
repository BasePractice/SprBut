syntax = "proto3";

package ru.sprbut.m30;

option java_multiple_files = true;
option java_package = "ru.sprbut.m30.grpc";

// Отправка событий пользователям, подключённым к любому экземпляру сервиса.
service Notifier {
  // Событие одному пользователю: PUBLISH в канал sse:user:{user_id}.
  rpc SendToUser(UserMessage) returns (Accepted);
  // Событие всем подключённым: PUBLISH в канал sse:broadcast.
  rpc Broadcast(BroadcastMessage) returns (Accepted);
}

message UserMessage {
  int64 user_id = 1;
  // Имя события SSE, пустое заменяется на user-event.
  string event = 2;
  string text = 3;
}

message BroadcastMessage {
  // Имя события SSE, пустое заменяется на broadcast.
  string event = 1;
  string text = 2;
}

message Accepted {
  // Сколько экземпляров сервиса получили PUBLISH.
  int64 receivers = 1;
}
