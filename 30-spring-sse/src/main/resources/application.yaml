spring:
  application:
    name: sse
  aop:
    proxy-target-class: off
  main:
    banner-mode: off
  data:
    redis:
      host: localhost
      database: 1
      connect-timeout: 5s
  grpc:
    server:
      port: 9090
management:
  endpoints:
    web:
      exposure:
        include: health,info,prometheus
  metrics:
    tags:
      application: ${spring.application.name}
  prometheus:
    metrics:
      export:
        enabled: true
sse:
  heartbeat-timeout: 20s
  retry-pause: 1s
  # Пулы потоков: ThreadPoolExecutor растёт сверх core-size, только когда
  # полна очередь, а при полной очереди и max-size потоков отвергает задание.
  pools:
    # Доставка событий из каналов Redis в потоки пользователей.
    delivery:
      core-size: 4
      max-size: 4
      queue-capacity: 10000
      keep-alive: 60s
    # Обработка вызовов gRPC.
    commands:
      core-size: 8
      max-size: 32
      queue-capacity: 500
      keep-alive: 30s
