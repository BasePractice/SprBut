# Два экземпляра сервиса за общим Redis: событие, отправленное через один,
# доходит до пользователей, подключённых к другому.
# Перед запуском собрать jar: mvn package

x-check: &check
  interval: 5s
  timeout: 3s
  retries: 30

x-sse: &sse
  build:
    context: .
  environment:
    SPRING_DATA_REDIS_HOST: redis
    SSE_HEARTBEAT_TIMEOUT: 2s
  depends_on:
    redis:
      condition: service_healthy
  healthcheck:
    test: ["CMD", "bash", "-c", "exec 3<>/dev/tcp/127.0.0.1/8080"]
    <<: *check

services:
  redis:
    image: redis:8
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      <<: *check

  sse-one:
    <<: *sse
    ports:
      - "8081:8080"

  sse-two:
    <<: *sse
    ports:
      - "8082:8080"
